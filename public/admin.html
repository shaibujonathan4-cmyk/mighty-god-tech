<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Dashboard | Management Portal</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --admin-bg: #0F172A;        
      --admin-card: #1E293B;      
      --admin-card-light: #334155;
      --admin-cyan: #06B6D4;      
      --admin-cyan-hover: #0891B2;
      --admin-emerald: #10B981;   
      --admin-border: #334155;    
      --admin-text-main: #F8FAFC; 
      --admin-text-sub: #94A3B8;  
    }

    *, *::before, *::after { 
      box-sizing: border-box; 
    }

    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
      background-color: var(--admin-bg) !important;
      color: var(--admin-text-main) !important;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* Admin Navbar */
    .admin-navbar {
      background: var(--admin-card);
      border-bottom: 1px solid var(--admin-border);
      padding: 0.75rem 0.85rem;
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
    }

    .nav-container-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    .admin-badge {
      background: rgba(6, 182, 212, 0.15);
      color: var(--admin-cyan);
      font-size: 0.65rem;
      font-weight: 700;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      border: 1px solid rgba(6, 182, 212, 0.3);
      text-transform: uppercase;
      display: inline-block;
    }

    /* Main Container & Layout */
    .admin-container {
      width: 100%;
      max-width: 1200px;
      margin: 1rem auto;
      padding: 0 0.85rem;
    }

    .admin-layout { 
      display: grid; 
      grid-template-columns: 240px 1fr; 
      gap: 1.25rem; 
      width: 100%;
    }

    .admin-sidebar { 
      background: var(--admin-card); 
      border: 1px solid var(--admin-border); 
      border-radius: 10px; 
      padding: 0.5rem; 
      width: 100%;
    }

    .nav-menu { 
      display: flex; 
      flex-direction: column; 
      gap: 0.4rem; 
      width: 100%;
    }
    
    .nav-btn { 
      background: transparent; 
      color: var(--admin-text-sub); 
      border: none; 
      padding: 0.7rem 0.8rem; 
      border-radius: 8px; 
      text-align: left; 
      cursor: pointer; 
      font-size: 0.85rem; 
      font-weight: 600; 
      display: flex; 
      align-items: center; 
      gap: 0.5rem; 
      transition: all 0.2s ease-in-out; 
      white-space: nowrap;
    }

    .nav-btn:hover { 
      background: var(--admin-card-light); 
      color: var(--admin-text-main); 
    }

    .nav-btn.active { 
      background: rgba(6, 182, 212, 0.15); 
      color: var(--admin-cyan); 
      border-left: 3px solid var(--admin-cyan); 
    }

    .tab-content { display: none; width: 100%; }
    .tab-content.active { display: block; }

    /* Dashboard Stat Cards */
    .stats-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); 
      gap: 0.75rem; 
      margin-bottom: 1.25rem; 
      width: 100%;
    }
    
    .stat-card { 
      background: var(--admin-card); 
      border: 1px solid var(--admin-border); 
      padding: 0.85rem; 
      border-radius: 10px;
    }
    
    .stat-card span {
      color: var(--admin-text-sub);
      font-size: 0.7rem;
      font-weight: 600;
    }

    .stat-card h3 { 
      color: var(--admin-cyan); 
      font-size: 1.4rem; 
      margin: 0.2rem 0 0 0; 
      font-weight: 700;
    }

    .stat-card.emerald h3 { color: var(--admin-emerald); }

    /* Forms & Inputs */
    .admin-grid { 
      display: grid; 
      grid-template-columns: 1fr 1.5fr; 
      gap: 1.25rem; 
      width: 100%;
    }
    
    .form-card { 
      background: var(--admin-card); 
      border: 1px solid var(--admin-border); 
      padding: 1rem; 
      border-radius: 10px; 
      width: 100%;
    }

    .form-group { margin-bottom: 0.85rem; width: 100%; }
    
    .form-group label { 
      display: block; 
      color: var(--admin-text-main); 
      font-size: 0.8rem; 
      font-weight: 600; 
      margin-bottom: 0.3rem; 
    }

    .form-control { 
      width: 100%; 
      max-width: 100%;
      padding: 0.6rem 0.75rem; 
      background: var(--admin-bg); 
      border: 1px solid var(--admin-border); 
      color: var(--admin-text-main); 
      border-radius: 6px; 
      font-size: 0.85rem; 
    }

    .form-control:focus { outline: none; border-color: var(--admin-cyan); }

    /* Buttons */
    .btn-cyan {
      background: var(--admin-cyan);
      color: #0F172A;
      font-weight: 700;
      border: none;
      padding: 0.65rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      width: 100%;
    }

    /* Admin List */
    .admin-list { 
      display: flex; 
      flex-direction: column; 
      gap: 0.65rem; 
      width: 100%;
    }
    
    .admin-item { 
      background: var(--admin-card); 
      border: 1px solid var(--admin-border); 
      border-radius: 8px; 
      padding: 0.65rem; 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      gap: 0.5rem; 
      width: 100%;
      min-width: 0; 
    }

    .admin-item img { 
      width: 48px; 
      height: 48px; 
      object-fit: cover; 
      border-radius: 6px; 
      flex-shrink: 0; 
    }

    .item-text-info {
      flex: 1;
      min-width: 0; /* Prevents long titles from pushing elements offscreen */
      overflow: hidden;
    }

    .item-text-info h4 {
      color: var(--admin-text-main); 
      font-size: 0.8rem; 
      margin: 2px 0 0 0; 
      text-overflow: ellipsis; 
      overflow: hidden; 
      white-space: nowrap;
    }

    .actions { display: flex; gap: 0.3rem; flex-shrink: 0; }
    
    .btn-action { 
      border: none; 
      padding: 0.4rem 0.55rem; 
      border-radius: 5px; 
      cursor: pointer; 
      font-size: 0.75rem; 
      font-weight: 700; 
    }

    .btn-edit { background: var(--admin-card-light); color: var(--admin-cyan); }
    .btn-delete { background: rgba(220, 38, 38, 0.2); color: #EF4444; border: 1px solid rgba(220, 38, 38, 0.3); }

    .site-link-btn {
      background: transparent;
      border: 1px solid var(--admin-border);
      color: var(--admin-text-sub);
      padding: 0.35rem 0.6rem;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 600;
    }

    /* STRICT MOBILE OVERFLOW OVERRIDES */
    @media (max-width: 768px) {
      .admin-layout { 
        grid-template-columns: 1fr; 
        gap: 0.85rem; 
      }
      
      .admin-grid { 
        grid-template-columns: 1fr; 
        gap: 1rem;
      }

      /* Horizontal Scrollable Menu */
      .admin-sidebar {
        overflow-x: auto;
        padding: 0.35rem;
        border-radius: 8px;
      }

      .nav-menu { 
        flex-direction: row; 
        overflow-x: auto; 
        width: max-content;
      }

      .nav-btn {
        padding: 0.5rem 0.75rem;
        border-left: none !important;
        border-bottom: 2px solid transparent;
        font-size: 0.75rem;
      }

      .nav-btn.active {
        border-bottom: 2px solid var(--admin-cyan) !important;
        background: rgba(6, 182, 212, 0.1);
      }

      .section-header-title {
        font-size: 1.1rem !important;
        margin-bottom: 0.75rem !important;
      }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="admin-navbar">
    <div class="nav-container-flex">
      <a href="index.html" style="text-decoration:none; display:flex; align-items:center; gap:0.4rem;">
        <div style="background:var(--admin-cyan); color:#0F172A; font-weight:900; padding:0.25rem 0.45rem; border-radius:5px; font-size:0.85rem;">MG</div>
        <div>
          <div style="color:var(--admin-text-main); font-weight:800; font-size:0.85rem;">MIGHTY GOD</div>
          <span class="admin-badge">Admin</span>
        </div>
      </a>
      <a href="index.html" class="site-link-btn"><i class="fa-solid fa-globe"></i> Live Site</a>
    </div>
  </nav>

  <div class="admin-container">
    <div class="admin-layout">
      <!-- SIDEBAR MENU -->
      <div class="admin-sidebar">
        <div class="nav-menu">
          <button class="nav-btn active" onclick="switchTab('analyticsTab', this)">
            <i class="fa-solid fa-chart-pie"></i> Analytics
          </button>
          <button class="nav-btn" onclick="switchTab('worksTab', this)">
            <i class="fa-solid fa-photo-film"></i> Manage Works
          </button>
          <button class="nav-btn" onclick="switchTab('settingsTab', this)">
            <i class="fa-solid fa-sliders"></i> Site Settings
          </button>
        </div>
      </div>

      <!-- MAIN CONTENT -->
      <div>
        <!-- TAB 1: ANALYTICS -->
        <div id="analyticsTab" class="tab-content active">
          <h2 class="section-header-title" style="color:var(--admin-text-main); font-size:1.1rem; margin-bottom:0.75rem; font-weight:700;">Page Analytics</h2>
          <div class="stats-grid">
            <div class="stat-card">
              <span>Works Uploaded</span>
              <h3 id="statProjects">0</h3>
            </div>
            <div class="stat-card emerald">
              <span>Page Visits</span>
              <h3 id="statVisits">1,420</h3>
            </div>
            <div class="stat-card">
              <span>Leads</span>
              <h3 id="statInquiries">38</h3>
            </div>
          </div>
        </div>

        <!-- TAB 2: MANAGE WORKS -->
        <div id="worksTab" class="tab-content">
          <h2 class="section-header-title" style="color:var(--admin-text-main); font-size:1.1rem; margin-bottom:0.75rem; font-weight:700;">Manage Gallery Projects</h2>
          <div class="admin-grid">
            <!-- UPLOAD FORM -->
            <div class="form-card">
              <h3 style="color:var(--admin-text-main); font-size:0.9rem; margin-bottom: 0.85rem;"><i class="fa-solid fa-cloud-arrow-up" style="color:var(--admin-cyan);"></i> Add New Work</h3>
              <form id="addProjectForm" enctype="multipart/form-data">
                <div class="form-group">
                  <label>Project Title *</label>
                  <input type="text" id="pTitle" class="form-control" placeholder="e.g. Frameless Entryway" required>
                </div>
                <div class="form-group">
                  <label>Category</label>
                  <select id="pCategory" class="form-control">
                    <option value="WINDOWS">WINDOWS</option>
                    <option value="CURTAIN WALLS">CURTAIN WALLS</option>
                    <option value="PARTITIONS">PARTITIONS</option>
                    <option value="FRAMELESS DOORS">FRAMELESS DOORS</option>
                    <option value="BALCONY RAILINGS">BALCONY RAILINGS</option>
                  </select>
                </div>
                <div class="form-group">
                  <label>Select Photo *</label>
                  <input type="file" id="pImage" class="form-control" accept="image/*" required>
                </div>
                <div class="form-group">
                  <label>Description</label>
                  <textarea id="pDesc" class="form-control" rows="2" placeholder="Details..."></textarea>
                </div>
                <button type="submit" class="btn-cyan">Upload & Publish</button>
              </form>
            </div>

            <!-- PROJECT LIST -->
            <div>
              <h3 style="color:var(--admin-text-main); font-size:0.9rem; margin-bottom: 0.85rem;"><i class="fa-solid fa-images" style="color:var(--admin-cyan);"></i> Live Works</h3>
              <div class="admin-list" id="adminProjectList">
                <p style="color:var(--admin-text-sub); font-size:0.8rem;">Loading projects...</p>
              </div>
            </div>
          </div>
        </div>

        <!-- TAB 3: SITE SETTINGS -->
        <div id="settingsTab" class="tab-content">
          <h2 class="section-header-title" style="color:var(--admin-text-main); font-size:1.1rem; margin-bottom:0.75rem; font-weight:700;">Homepage Content Settings</h2>
          <div class="form-card">
            <form id="settingsForm">
              <div class="form-group">
                <label>Homepage Headline</label>
                <input type="text" id="sHeadline" class="form-control">
              </div>
              <div class="form-group">
                <label>Homepage Subtitle / Tagline</label>
                <textarea id="sTagline" class="form-control" rows="2"></textarea>
              </div>
              <div class="form-group">
                <label>Contact Phone Number</label>
                <input type="text" id="sPhone" class="form-control">
              </div>
              <div class="form-group">
                <label>Business Address</label>
                <input type="text" id="sAddress" class="form-control">
              </div>
              <div class="form-group">
                <label>CAC / RC Registration Number</label>
                <input type="text" id="sRc" class="form-control">
              </div>
              <button type="submit" class="btn-cyan">Save Changes</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function switchTab(tabId, element) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      element.classList.add('active');
    }

    async function loadAnalytics() {
      try {
        const res = await fetch('/api/analytics');
        const data = await res.json();
        document.getElementById('statProjects').innerText = data.totalProjects;
        document.getElementById('statVisits').innerText = data.totalVisits;
        document.getElementById('statInquiries').innerText = data.inquiries;
      } catch (err) {}
    }

    async function loadAdminProjects() {
      const container = document.getElementById('adminProjectList');
      try {
        const res = await fetch('/api/projects');
        const projects = await res.json();
        
        if (!Array.isArray(projects) || projects.length === 0) {
          container.innerHTML = '<p style="color:var(--admin-text-sub); font-size:0.8rem;">No custom works added yet.</p>';
          return;
        }

        container.innerHTML = projects.map(item => `
          <div class="admin-item">
            <img src="${item.url}" alt="Work">
            <div class="item-text-info">
              <span style="color:var(--admin-cyan); font-size:0.68rem; font-weight:700; display:block;">${item.category}</span>
              <h4>${item.title}</h4>
            </div>
            <div class="actions">
              <button class="btn-action btn-edit" onclick="editProject('${item.id}', '${escape(item.title)}')"><i class="fa-solid fa-pen"></i></button>
              <button class="btn-action btn-delete" onclick="deleteProject('${item.id}')"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = `<p style="color:#EF4444; font-size:0.8rem;">Error loading works.</p>`;
      }
    }

    async function loadSettings() {
      try {
        const res = await fetch('/api/settings');
        const s = await res.json();
        document.getElementById('sHeadline').value = s.headline || '';
        document.getElementById('sTagline').value = s.tagline || '';
        document.getElementById('sPhone').value = s.phone || '';
        document.getElementById('sAddress').value = s.address || '';
        document.getElementById('sRc').value = s.rc || '';
      } catch (err) {}
    }

    document.getElementById('addProjectForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData();
      formData.append('title', document.getElementById('pTitle').value);
      formData.append('category', document.getElementById('pCategory').value);
      formData.append('description', document.getElementById('pDesc').value);
      formData.append('image', document.getElementById('pImage').files[0]);

      const res = await fetch('/api/projects', { method: 'POST', body: formData });
      if (res.ok) {
        document.getElementById('addProjectForm').reset();
        loadAdminProjects();
        loadAnalytics();
      }
    });

    document.getElementById('settingsForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = {
        headline: document.getElementById('sHeadline').value,
        tagline: document.getElementById('sTagline').value,
        phone: document.getElementById('sPhone').value,
        address: document.getElementById('sAddress').value,
        rc: document.getElementById('sRc').value
      };
      const res = await fetch('/api/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      if (res.ok) alert('Settings saved successfully!');
    });

    async function editProject(id, oldTitle) {
      const newTitle = prompt("Edit Work Title:", unescape(oldTitle));
      if (!newTitle) return;

      await fetch(`/api/projects/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: newTitle })
      });
      loadAdminProjects();
    }

    async function deleteProject(id) {
      if (!confirm('Are you sure you want to delete this item?')) return;
      await fetch(`/api/projects/${id}`, { method: 'DELETE' });
      loadAdminProjects();
      loadAnalytics();
    }

    loadAnalytics();
    loadAdminProjects();
    loadSettings();
  </script>
</body>
</html>
